<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Deck Builder</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='deck_builder.css'>
</head>

<body>
    <header>
        <h1>Deck Builder</h1>
    </header>
    <main>
        <section id="card-pool">
            <h2>Pool de Cartes</h2>
            <div id="available-cards" class="card-container"></div>
        </section>
        <section id="deck">
            <h2>Votre Deck</h2>
            <div id="deck-cards" class="card-container"></div>
            <div id="trash-zone" class="trash-zone">
                Drop here to remove from deck
            </div>
            <button id="save-deck">Sauvegarder le Deck</button>
        </section>

    </main>
    <script src="scripts.js"></script>
</body>

</html>
